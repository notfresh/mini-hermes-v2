# Layer 1: module/file distribution — plugin subsystem
# 4 files: plugin_manager.py, plugin_manifest.py, plugin_tools.py, plugin_hooks.py
# 1 consumer: cli.py

# ── File nodes ──────────────────────────────────────────────────────────────

[[nodes]]
id = "file.plugin_manager"
kind = "file"
path = "plugin_manager.py"
layer = "capability"
desc = "Plugin manager — install/remove/list + record of V2 plugins. Exposes MANAGED_DIR, INSTALLED_FILE, _run_plugin_command"

[[nodes]]
id = "file.plugin_manifest"
kind = "file"
path = "plugin_manifest.py"
layer = "capability"
desc = "Plugin manifest loader — parses PluginManifest from plugin directory; uses plugin_manager.MANAGED_DIR"

[[nodes]]
id = "file.plugin_tools"
kind = "file"
path = "plugin_tools.py"
layer = "capability"
desc = "Plugin tools loader — discovers Python tools from plugins; uses plugin_manager.MANAGED_DIR, INSTALLED_FILE"

[[nodes]]
id = "file.plugin_hooks"
kind = "file"
path = "plugin_hooks.py"
layer = "capability"
desc = "Plugin hook executor — runs session-start hooks (shell + Python); uses plugin_manager.MANAGED_DIR, INSTALLED_FILE"

[[nodes]]
id = "file.cli"
kind = "file"
path = "cli.py"
layer = "entry"
desc = "CLI entrypoint — installs plugins and delegates to plugin_manager._run_plugin_command"

